name: Daily Stock Scanner

on:
  schedule:
    # 每天台灣時間 08:00 執行 (UTC 00:00) — 開盤前晨間掃描
    - cron: '0 0 * * 1-5'
    # 每天台灣時間 12:00 執行 (UTC 04:00) — 盤中掃描
    - cron: '0 4 * * 1-5'
  workflow_dispatch: # 支援手動觸發

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chinese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Run Daily Scanner
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: |
          # 執行掃描並截圖 (擴大掃描全台股前 2000 大，僅截圖有訊號的股票以節省資源)
          python daily_scanner.py --top 2000 --min-patterns 2

      - name: Upload Daily Report
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-${{ github.run_id }}
          path: |
            daily_reports/
            screenshots/

      - name: Back up to Google Drive
        env:
          GCP_CREDENTIALS_B64: ${{ secrets.GCP_CREDENTIALS_B64 }}
        run: |
          # 執行上傳工具 (如果沒有設定 Secret 則會印出跳過)
          python upload_to_gdrive.py
